<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="1040" height="940" font-family="Arial, Helvetica, sans-serif">
  <title>Nextion screen layout for the heater controller (480 x 320)</title>

  <!-- Page background (outside the screen) -->
  <rect x="0" y="0" width="520" height="470" fill="#f4f5f7"/>

  <!-- Screen bezel -->
  <rect x="8" y="8" width="504" height="344" rx="10" fill="#111418"/>

  <!-- Screen area: 480 x 320, origin at (20,20) -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="480" height="320" fill="#1b1f24"/>

    <!-- ===== Title row ===== -->
    <text x="10" y="25" fill="#ffffff" font-size="18" font-weight="bold">HEATER CONTROL</text>
    <rect x="300" y="4" width="170" height="28" rx="4" fill="#2b313a" stroke="#4a5361"/>
    <text x="385" y="24" fill="#7ee2a8" font-size="16" font-weight="bold" text-anchor="middle">HOLDING</text>
    <text x="467" y="30" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">tStatus</text>

    <!-- ===== Live readouts ===== -->
    <text x="10" y="54" fill="#9aa4b2" font-size="12">CURRENT °F</text>
    <rect x="10" y="60" width="225" height="80" rx="4" fill="#2b313a" stroke="#4a5361"/>
    <text x="122" y="117" fill="#ffffff" font-size="44" font-weight="bold" text-anchor="middle">499.6</text>
    <text x="232" y="137" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">tTemp</text>

    <text x="245" y="54" fill="#9aa4b2" font-size="12">TIME LEFT</text>
    <rect x="245" y="60" width="140" height="80" rx="4" fill="#2b313a" stroke="#4a5361"/>
    <text x="315" y="109" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">1:23:45</text>
    <text x="382" y="137" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">tLeft</text>

    <text x="395" y="54" fill="#9aa4b2" font-size="12">POWER</text>
    <rect x="395" y="60" width="75" height="80" rx="4" fill="#2b313a" stroke="#4a5361"/>
    <text x="432" y="109" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">42%</text>
    <text x="467" y="137" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">tOut</text>

    <!-- ===== Settings ===== -->
    <text x="10" y="160" fill="#9aa4b2" font-size="12">TARGET °F</text>
    <rect x="10" y="166" width="55" height="60" rx="6" fill="#3d4a5c" stroke="#5c6b80"/>
    <text x="37" y="206" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">−</text>
    <text x="62" y="223" fill="#f5c542" font-size="7" font-family="Consolas, monospace" text-anchor="end">bTempDn</text>

    <rect x="70" y="166" width="105" height="60" rx="4" fill="#0f3d5c" stroke="#2f7fb5"/>
    <text x="122" y="207" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">500</text>
    <text x="172" y="223" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">nTemp</text>

    <rect x="180" y="166" width="55" height="60" rx="6" fill="#3d4a5c" stroke="#5c6b80"/>
    <text x="207" y="206" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">+</text>
    <text x="232" y="223" fill="#f5c542" font-size="7" font-family="Consolas, monospace" text-anchor="end">bTempUp</text>

    <text x="245" y="160" fill="#9aa4b2" font-size="12">HOLD TIME (MIN)</text>
    <rect x="245" y="166" width="55" height="60" rx="6" fill="#3d4a5c" stroke="#5c6b80"/>
    <text x="272" y="206" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">−</text>
    <text x="297" y="223" fill="#f5c542" font-size="7" font-family="Consolas, monospace" text-anchor="end">bMinDn</text>

    <rect x="305" y="166" width="105" height="60" rx="4" fill="#0f3d5c" stroke="#2f7fb5"/>
    <text x="357" y="207" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">90</text>
    <text x="407" y="223" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">nMin</text>

    <rect x="415" y="166" width="55" height="60" rx="6" fill="#3d4a5c" stroke="#5c6b80"/>
    <text x="442" y="206" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">+</text>
    <text x="467" y="223" fill="#f5c542" font-size="7" font-family="Consolas, monospace" text-anchor="end">bMinUp</text>

    <!-- ===== Fault message ===== -->
    <rect x="10" y="232" width="460" height="28" rx="4" fill="#2b313a" stroke="#4a5361"/>
    <text x="18" y="251" fill="#ff8a80" font-size="13">(fault reason appears here, e.g. E-stop pressed or E-stop wire broken)</text>
    <text x="467" y="257" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">tMsg</text>

    <!-- ===== Start / Stop ===== -->
    <rect x="10" y="266" width="225" height="48" rx="6" fill="#1f8a4c" stroke="#2fb866"/>
    <text x="122" y="298" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">START</text>
    <text x="232" y="311" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">bStart</text>

    <rect x="245" y="266" width="225" height="48" rx="6" fill="#c0392b" stroke="#e5604f"/>
    <text x="357" y="298" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">STOP</text>
    <text x="467" y="311" fill="#f5c542" font-size="8" font-family="Consolas, monospace" text-anchor="end">bStop</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="11" fill="#333a44">
    <text x="20" y="374" font-weight="bold" font-size="12">480 × 320 screen. Yellow labels are component names (must match exactly).</text>
    <rect x="20" y="384" width="12" height="12" fill="#2b313a"/><text x="38" y="394">Text (Arduino writes these)</text>
    <rect x="200" y="384" width="12" height="12" fill="#0f3d5c"/><text x="218" y="394">Number (you set these)</text>
    <rect x="360" y="384" width="12" height="12" fill="#3d4a5c"/><text x="378" y="394">Button</text>
    <text x="20" y="418" font-weight="bold">Not visible on screen (add them anyway; they appear below the page in Nextion Editor):</text>
    <text x="20" y="436" font-family="Consolas, monospace" font-size="10.5">Variables (Number): aSet aMin aState link dirtyT dirtyM wantRun wantStop</text>
    <text x="20" y="452" font-family="Consolas, monospace" font-size="10.5">Variables (String): va0 va1</text>
    <text x="260" y="452" font-family="Consolas, monospace" font-size="10.5">Timer: tm0 (tim = 500, en = 1)</text>
  </g>
</svg>
